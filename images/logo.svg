<svg width="180" height="45" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Define gradient for modern look -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#03917e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#04B096;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Circuit-inspired design element -->
  <g>
    <!-- Main circle/node -->
    <circle cx="20" cy="22.5" r="8" fill="none" stroke="url(#grad1)" stroke-width="2.5"/>
    <circle cx="20" cy="22.5" r="3" fill="#03917e"/>

    <!-- Circuit traces -->
    <line x1="28" y1="22.5" x2="38" y2="22.5" stroke="#03917e" stroke-width="2"/>
    <circle cx="38" cy="22.5" r="2" fill="#03917e"/>

    <!-- Vertical trace -->
    <line x1="20" y1="14.5" x2="20" y2="8" stroke="#03917e" stroke-width="2"/>
    <circle cx="20" cy="8" r="2" fill="#03917e"/>
  </g>

  <!-- Text: Leon Nachtrab -->
  <text x="48" y="20" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#2C3E50" letter-spacing="0.5">
    LEON
  </text>
  <text x="48" y="34" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#7F8C8D" letter-spacing="1">
    NACHTRAB
  </text>

  <!-- Small accent line -->
  <rect x="48" y="24" width="25" height="1.5" fill="url(#grad1)" rx="0.75"/>
</svg>
